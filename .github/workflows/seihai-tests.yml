# Seihai project, 2026-10-31 (Windows job 2026-11-04; macOS moved to the lab VM 2026-11-12): see CHANGES-SEIHAI.md.
name: seihai-tests

on:
  push:
    branches: [seihai]
  pull_request:
    branches: [seihai]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y g++-14 ninja-build zlib1g-dev libbz2-dev
      - name: Configure
        run: CC=gcc-14 CXX=g++-14 cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DGS2LIB_TESTS=ON
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure

  # macOS is built and tested on the lab Sequoia VM with the macOS CMake
  # preset, not on GitHub runners (README.md, "macOS builds").

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # zlib and bzip2 come from vcpkg (the runner's copy), in manifest mode from
      # vcpkg.json, with the x64-windows-static triplet that CMakeLists.txt sets.
      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -A x64 -DGS2LIB_TESTS=ON "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
      - name: Build
        run: cmake --build build --config Debug -j
      - name: Test
        run: ctest --test-dir build -C Debug --output-on-failure
