# Seihai project, 2026-10-31 (Windows job 2026-11-04; macOS moved to the lab VM 2026-11-12; macOS release job 2026-11-19); lab leak check 2026-11-21: see CHANGES-SEIHAI.md.
name: seihai-tests

on:
  push:
    branches: [seihai]
    tags: ['v*']
  pull_request:
    branches: [seihai]
  # A manual run also builds and tests on macOS (#28).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Lab machine and VM names, home paths and image-relative code addresses
  # (.github/scripts/check_lab_leaks.py, shared across the Seihai suite).
  lab-leak-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No lab names, home paths or binary addresses
        run: python3 .github/scripts/check_lab_leaks.py

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y g++-14 ninja-build zlib1g-dev libbz2-dev
      - name: Configure
        run: CC=gcc-14 CXX=g++-14 cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DGS2LIB_TESTS=ON
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure

  # macOS does not run on every push: day to day it is built and tested on
  # the lab Sequoia VM (README.md, "macOS builds"). It must build at release
  # time, so a tag (v*) or a manual run builds the library and runs the same
  # unit tests on a GitHub macOS runner (#28). seihai-gserver-v2's release
  # workflow runs these tests again for the gs2lib commit it pins.
  macos:
    if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: brew install ninja
      # zlib and bzip2 come from the macOS SDK.
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DGS2LIB_TESTS=ON
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # zlib and bzip2 come from vcpkg (the runner's copy), in manifest mode from
      # vcpkg.json, with the x64-windows-static triplet that CMakeLists.txt sets.
      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -A x64 -DGS2LIB_TESTS=ON "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
      - name: Build
        run: cmake --build build --config Debug -j
      - name: Test
        run: ctest --test-dir build -C Debug --output-on-failure
