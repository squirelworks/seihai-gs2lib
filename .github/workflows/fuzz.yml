# Modified by the Seihai project, 2026-11-16, 2026-11-18: see CHANGES-SEIHAI.md.
# libFuzzer under ASan/UBSan for #27: weekly (120 s a target), and a 30 s
# smoke on pull requests that touch the decoders or the harnesses.
name: fuzz

on:
  pull_request:
    branches: [seihai]
    paths:
      - 'src/CEncryption.cpp'
      - 'src/CFileQueue.cpp'
      - 'src/CString.cpp'
      - 'src/IUtil.cpp'
      - 'include/**'
      - 'fuzz/**'
      - 'CMakeLists.txt'
      - '.github/workflows/fuzz.yml'
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 libclang-rt-18-dev libfuzzer-18-dev \
            ninja-build zlib1g-dev libbz2-dev
      - name: Configure
        run: |
          CC=clang-18 CXX=clang++-18 cmake -S . -B build-fuzz -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DGS2LIB_FUZZ=ON -DGS2LIB_TESTS=OFF -DSTATIC=ON -DNET=ON
      - name: Build
        run: cmake --build build-fuzz -j
      - name: Run each target briefly
        run: |
          set -euo pipefail
          secs=120
          if [ "${{ github.event_name }}" = pull_request ]; then secs=30; fi
          for t in fuzz_decrypt fuzz_decompress fuzz_version fuzz_frame; do
            echo "::group::$t"
            corp="fuzz/corpus/${t#fuzz_}"
            ./build-fuzz/"$t" -max_total_time=$secs -max_len=65536 "$corp"
            echo "::endgroup::"
          done
      - name: Upload crashers
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashers
          path: |
            crash-*
            leak-*
            timeout-*
          if-no-files-found: ignore
